# Integracao ClinicaPsi no nginx do Astra (astrasedution.com intacto)
# Dominios: psiianasantos.com.br / www / api.psiianasantos.com.br
#
# Pre-requisitos:
# 1) clinicapsi-app na rede astraseduction_astra-net (compose ja faz)
# 2) certificado: /etc/letsencrypt/live/psiianasantos.com.br/
# 3) incluir no default.conf do astra-nginx e recrear o container nginx

upstream clinicapsi_app {
    server clinicapsi-app:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name psiianasantos.com.br www.psiianasantos.com.br api.psiianasantos.com.br;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name psiianasantos.com.br www.psiianasantos.com.br api.psiianasantos.com.br;

    ssl_certificate     /etc/letsencrypt/live/psiianasantos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psiianasantos.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    if ($host = www.psiianasantos.com.br) {
        return 301 https://psiianasantos.com.br$request_uri;
    }

    location / {
        proxy_pass http://clinicapsi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
