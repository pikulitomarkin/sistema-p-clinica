# Snippet opcional para integrar ClinicaPsi no nginx do Astra
# quando houver dominio (ex.: clinica.seudominio.com).
#
# Como usar (sem quebrar astrasedution.com):
# 1) Coloque clinicapsi-app na mesma rede do nginx:
#      docker network connect astraseduction_astra-net clinicapsi-app
# 2) Acrescente este bloco em /opt/astraseduction/deploy/nginx/default.conf
# 3) Recarregue: docker exec astra-nginx nginx -s reload
#
# Enquanto nao houver dominio, use a porta 8080:
#   http://IP:8080

upstream clinicapsi_app {
    server clinicapsi-app:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name clinica.SEU_DOMINIO.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://clinicapsi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10m;
    }
}
