# Integracao ClinicaPsi no nginx do Astra (astrasedution.com intacto)
#
# Frontend: https://psiianasantos.com.br
# Backend/API: https://api.psiianasantos.com.br  (/api, /webhook, /health)
#
# IMPORTANTE: resolver Docker (127.0.0.11) + proxy_pass com variável
# para re-resolver o IP de clinicapsi-app após recreate (evita 502 com IP stale).

map $http_origin $clinicapsi_cors_origin {
    default "";
    "~*^https://(www\.)?psiianasantos\.com\.br$" $http_origin;
}

# -------- HTTP (ACME + redirect) --------
server {
    listen 80;
    listen [::]:80;
    server_name psiianasantos.com.br www.psiianasantos.com.br api.psiianasantos.com.br;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------- FRONTEND (site) --------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name psiianasantos.com.br www.psiianasantos.com.br;

    ssl_certificate     /etc/letsencrypt/live/psiianasantos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psiianasantos.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    # Docker embedded DNS — revalida IP do clinicapsi-app a cada 10s
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    if ($host = www.psiianasantos.com.br) {
        return 301 https://psiianasantos.com.br$request_uri;
    }

    location / {
        set $clinicapsi_upstream http://clinicapsi-app:8080;
        proxy_pass $clinicapsi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}

# -------- BACKEND (API) --------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.psiianasantos.com.br;

    ssl_certificate     /etc/letsencrypt/live/psiianasantos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psiianasantos.com.br/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location = / {
        default_type application/json;
        add_header Access-Control-Allow-Origin $clinicapsi_cors_origin always;
        return 200 '{"service":"clinicapsi-api","status":"ok","endpoints":["/health","/api/*","/webhook/*"]}';
    }

    location = /health {
        set $clinicapsi_upstream http://clinicapsi-app:8080;
        proxy_pass $clinicapsi_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        add_header Access-Control-Allow-Origin $clinicapsi_cors_origin always;
        access_log off;
    }

    location /api/ {
        set $clinicapsi_upstream http://clinicapsi-app:8080;
        proxy_pass $clinicapsi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Access-Control-Allow-Origin $clinicapsi_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    location /webhook/ {
        set $clinicapsi_upstream http://clinicapsi-app:8080;
        proxy_pass $clinicapsi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Paginas do site nao sao servidas neste host
    location / {
        default_type application/json;
        return 404 '{"error":"not_found","hint":"use /api/*, /webhook/* or /health"}';
    }
}
